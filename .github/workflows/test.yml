name: Test & Deploy

# `dev` is in both lists because feature work merges into `dev` and only
# reaches `main` at a release. With `main` alone, a feature pull request
# was never tested by CI at all -- #546 through #552 all merged unchecked
# on their own branches -- and the first automated run happened on the
# release pull request, after a week of changes had already been combined.
#
# `sheet-tests` and `deploy-ready` stay pinned to `refs/heads/main` below,
# so nothing about deployment moves: a `dev` push runs the unit and
# integration job and stops there.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ── Unit & Integration Tests ────────────────────────────────────────────────
  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    env:
      # The font-coverage corpus can only be asserted where the fonts
      # are. Set here so `tests/unit/test_font_coverage.py` runs its
      # whole-corpus assertions instead of skipping them, and so a
      # dropped apt package below fails the build rather than quietly
      # turning that test off.
      EXPECT_SYSTEM_FONTS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The same packages the deploy image installs (`nixpacks.toml` /
      # `railpack.json`). CI and production must not drift apart on the
      # package name: if they do, the test that proves player names
      # render stops covering the thing it is there for.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # CD_ENGINE_TOKEN authenticates the private champion-duel-engine pin in
      # requirements.txt. Without it pip cannot reach that repo and the whole
      # install fails, which would block every PR in this repo -- not just
      # Champion Duel work. Add it as a repo secret (fine-grained PAT, read
      # only, scoped to kevinkidwell/champion-duel-simulator).
      - name: Install dependencies
        env:
          CD_ENGINE_TOKEN: ${{ secrets.CD_ENGINE_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock pytest-timeout ruff

      # Lint runs here as well as in pre-commit because pre-commit is local and
      # skippable, and `tests/ruff.toml` carries a rule that only earns its
      # keep if it cannot be walked past: DTZ003/005/011, which ban reading the
      # machine's wall clock in a test. That is the bug that took `dev` red on
      # 1 September.
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          ruff check .
          ruff format --check .

      # Lint and the three suites below each `continue-on-error` and are gated
      # together at the end, so one failure no longer hides the rest.
      #
      # Every run on `dev` between 30 Aug and 1 Sep stopped at the first
      # failing step, so the queue was only ever visible one deep: the sqlite
      # failures hid an integration failure, which hid a date-dependent one.
      # `FORCE_PREMIUM=1` never ran at all in six consecutive runs. Fixing one
      # thing and watching a different failure appear reads as new breakage
      # when it is excavation.
      #
      # `continue-on-error` alone would make the JOB green while a suite is
      # red, so `Gate` re-fails it. Do not remove that step.
      - name: Run unit tests
        id: unit
        continue-on-error: true
        run: |
          pytest tests/unit/ -v --tb=short -m "not sheets"

      - name: Run integration tests
        id: integration
        continue-on-error: true
        run: |
          pytest tests/integration/ -v --tb=short -m "not sheets" --timeout=30

      # Re-run the suite as if every guild were Premium. Catches premium-only
      # code paths that the default (free-tier) suite doesn't exercise — e.g.
      # the multi-template manager, the FORCE_PREMIUM short-circuit, the
      # `<@id>` mention-or-name path, and the new survey question types.
      - name: Run suite with FORCE_PREMIUM=1
        id: premium
        continue-on-error: true
        env:
          FORCE_PREMIUM: "1"
        run: |
          pytest tests/unit/ tests/integration/ --tb=short -m "not sheets" --timeout=30

      # The gate. Without this the job reports success on a red suite.
      - name: Gate
        if: always()
        run: |
          LINT='${{ steps.lint.outcome }}'
          UNIT='${{ steps.unit.outcome }}'
          INTEGRATION='${{ steps.integration.outcome }}'
          PREMIUM='${{ steps.premium.outcome }}'
          echo "lint=$LINT unit=$UNIT integration=$INTEGRATION premium=$PREMIUM"
          FAILED=0
          for RESULT in "$LINT" "$UNIT" "$INTEGRATION" "$PREMIUM"; do
            if [ "$RESULT" != "success" ]; then FAILED=1; fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::A step above failed. Every step ran to completion -- read all the red ones, not just the first."
            exit 1
          fi
          echo "Lint and all three suites passed."

  # ── Sheet Integration Tests (pull requests into main) ───────────────────────
  # These run on the PR, not on the push that follows it. The `pull_request`
  # event checks out `refs/pull/N/merge` — the simulated merge result — so what
  # this validates is exactly what lands on `main`, and a red run blocks the
  # merge instead of blocking the deploy. Pair with "Require branches to be up
  # to date before merging", or the tested merge result goes stale when `main`
  # moves underneath the PR.
  #
  # It used to be the other way round (`if: github.ref == 'refs/heads/main'`),
  # which made the one place this lane ran the one place failing cost a deploy:
  # it could not prevent a bad merge, because by the time it ran the code was
  # already on `main`. All it could do was withhold the Railway signal, and it
  # did that to ~14% of pushes on quota errors alone — 4 of 29 between
  # 2026-07-02 and 2026-09-01, one needing three attempts and one never re-run
  # at all, so that deploy simply never happened.
  #
  # This is why hotfixes are PR'd rather than pushed direct (see CLAUDE.md's
  # hotfix exception): a direct push to `main` would get no sheet coverage at
  # all, and nothing would gate it.
  sheet-tests:
    name: Sheet Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: unit-and-integration

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          CD_ENGINE_TOKEN: ${{ secrets.CD_ENGINE_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock pytest-timeout pytest-rerunfailures

      - name: Run sheet integration tests
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TEST_SHEET_ID: ${{ secrets.TEST_SHEET_ID }}
        run: |
          # Quota is handled at the client now, not here: tests/conftest.py
          # builds the gspread client with `BackOffHTTPClient`, so a 429 is
          # retried on the individual call rather than failing a test and
          # replaying all ~18 of them after a 65-second sleep.
          #
          # That also covers the case the old comment here called
          # unfilterable — the storm save_* helpers swallowing their own 429s
          # and resurfacing as plain AssertionErrors on empty-sheet reads.
          # With backoff the swallowed call succeeds, so the assertion never
          # sees an empty sheet.
          #
          # One rerun stays as a net for anything backoff cannot absorb. If
          # the lane proves clean, drop it — a real regression fails twice.
          pytest tests/sheets/ -v --tb=short -m "sheets" \
            --reruns 1 --reruns-delay 30

  # ── Deploy gate ─────────────────────────────────────────────────────────────
  # Railway watches the main branch and deploys automatically, and waits on
  # this job's signal ("Wait for CI checks" is enabled on its GitHub
  # integration) — so a red job here is a deploy that silently does not happen.
  #
  # Only the unit lane gates it. The sheet lane sat here until 1.8.10 and was
  # the wrong shape for a gate: it talks to a live Google account on a shared
  # per-minute write quota, so its failures were mostly infrastructure, and a
  # gate cannot tell "the code is broken" from "we could not reach Google".
  # It now runs on the PR into main and blocks the merge instead, which is both
  # earlier and re-runnable without a production consequence.
  deploy-ready:
    name: All Tests Passed
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [unit-and-integration]

    steps:
      - name: Signal deployment readiness
        run: |
          echo "✅ All tests passed. Railway deployment can proceed."
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
