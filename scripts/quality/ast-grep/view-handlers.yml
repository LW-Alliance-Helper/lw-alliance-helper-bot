# Enumerate every owner guard, timeout handler and storm-style guard, for the
# shared-base-view consolidation (#589 item 1) and its verification: the
# success test is zero matches outside the preserved set recorded there, not
# zero matches. Both spellings of the cleanup call have to be searched: the
# bare `expire_view_message(...)` and the qualified `wizard_registry.expire_view_message(...)`
# are different tree shapes.
id: any-interaction-check
language: python
rule:
  kind: function_definition
  has: { field: name, regex: "^interaction_check$" }
---
id: any-on-timeout
language: python
rule:
  kind: function_definition
  has: { field: name, regex: "^on_timeout$" }
---
id: any-guard-owner
language: python
rule:
  kind: function_definition
  has: { field: name, regex: "^_guard_owner$" }
---
# The third shape the 2026-09-11 fold found: an inline owner check at the top
# of a component callback, which the view's inherited `interaction_check`
# already covers. `!=` only: the `==`-then-return-True form lives in the two
# preserved `interaction_check` methods and nowhere else.
id: inline-owner-check
language: python
rule:
  kind: if_statement
  has:
    field: condition
    pattern: $I.user.id != $OWNER
  not:
    inside:
      kind: function_definition
      has: { field: name, regex: "^(interaction_check|_guard_owner)$" }
      stopBy: end
---
# A Prev / Next button built by hand rather than through
# `ExpiringView.add_pagination_row` (2026-09-12). Matches the label string
# inside a `discord.ui.Button(...)` call, so a step button that happens to say
# "Next" shows up too; the preserved set on #589 lists those.
id: hand-built-pager
language: python
rule:
  kind: string
  regex: '◀|▶|\bPrev\b|\bNext\b'
  inside:
    kind: call
    has: { field: function, regex: 'discord[.]ui[.]Button$' }
    stopBy: end
